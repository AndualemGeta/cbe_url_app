<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CBE Transaction Checker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="cbe_logo.png">
  <style>
    body {
      background: url('background.jpeg') no-repeat center center fixed;
      background-size: cover;
      min-height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #fff;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      border-radius: 16px;
      padding: 32px 24px 24px 24px;
      max-width: 400px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: stretch;
    }
    .logo {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      margin: 0 auto 16px auto;
      display: block;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      background: #fff;
      border: 2px solid #e9ecef;
      object-fit: cover;
    }
    h2 {
      text-align: center;
      margin-bottom: 24px;
      color: #222;
    }
    label {
      margin-top: 12px;
      margin-bottom: 4px;
      font-size: 15px;
      color: #333;
      font-weight: 500;
    }
    input {
      width: 100%;
      padding: 12px 5px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 16px;
      margin-bottom: 4px;
      background: #f9fafb;
      transition: border 0.2s;
    }
    input:focus {
      border-color: #007bff;
      outline: none;
      background: #fff;
    }
    .error {
      color: #d32f2f;
      font-size: 13px;
      margin-bottom: 4px;
      min-height: 18px;
    }
    .button-row {
      margin-top: 18px;
      position: relative;
    }
    button {
      width: 100%;
      padding: 12px;
      background: linear-gradient(90deg, #007bff 60%, #0056b3 100%);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      box-shadow: 0 2px 8px rgba(0,123,255,0.08);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    button:disabled {
      background: #b0c4de;
      cursor: not-allowed;
    }
    .spinner {
      border: 3px solid #f3f3f3;
      border-top: 3px solid #007bff;
      border-radius: 50%;
      width: 18px;
      height: 18px;
      animation: spin 1s linear infinite;
      margin-right: 8px;
      display: inline-block;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @media (max-width: 500px) {
      .card {
        padding: 18px 6vw 18px 6vw;
        max-width: 98vw;
      }
      h2 {
        font-size: 1.2rem;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <div style="display: flex; justify-content: flex-end; align-items: center; margin-bottom: 8px;">
      <select id="langSelect" style="border-radius:6px; padding:4px 8px; font-size:14px;">
        <option value="en">English</option>
        <option value="am">አማርኛ</option>
      </select>
    </div>
    <img src="cbe_logo.png" alt="CBE Logo" class="logo" width="60" height="60" />
    <h2>CBE Transaction Checker</h2>
    <label for="transactionId">Enter Transaction ID:</label>
    <input type="text" id="transactionId" placeholder="e.g.FT123456">
    <div id="transactionIdError" class="error"></div>
    <label for="accountDigits">Enter Account Number :</label>
    <input type="text" id="accountDigits" placeholder="e.g.1000123456789" maxlength="13" list="accountDigitsList">
    <datalist id="accountDigitsList"></datalist>
    <div id="accountDigitsError" class="error"></div>
    <div class="button-row">
      <button id="openBtn" onclick="buildAndOpenUrl()">
        <span id="spinner" style="display:none" class="spinner"></span>
        <span id="btnText">Open Transaction</span>
      </button>
    </div>
  </div>
  <script>
    const translations = {
      en: {
        title: 'CBE Transaction Checker',
        transactionIdLabel: 'Enter Transaction ID:',
        transactionIdPlaceholder: 'e.g.FT123456',
        accountDigitsLabel: 'Enter Bank Account Number :',
        accountDigitsPlaceholder: 'e.g.1000123456789',
        openBtn: 'Open Transaction',
        openingBtn: 'Opening...',
        transactionIdError: 'Transaction ID is required.',
        accountDigitsError: 'Enter exactly 13 numeric digits.'
      },
      am: {
        title: 'የንግድ ባንክ ግብይት ማረጋገጫ',
        transactionIdLabel: 'የግብይት መለያ ቁጥር ያስገቡ፡',
        transactionIdPlaceholder: 'ለምሳሌ፡ FT123456',
        accountDigitsLabel: 'የባንክ ቁጥር ያስገቡ፡',
        accountDigitsPlaceholder: 'ለምሳሌ፡ 1000123456789',
        openBtn: 'ግብይቱን አረጋግጥ',
        openingBtn: 'በመክፈት ላይ...',
        transactionIdError: 'የግብይት መለያ ቁጥር ያስፈልጋል።',
        accountDigitsError: 'ትክክለኛ 13 አሃዝ ያስገቡ።'
      }
    };

    function setLanguage(lang) {
      const t = translations[lang];
      document.querySelector('h2').textContent = t.title;
      document.querySelector('label[for="transactionId"]').textContent = t.transactionIdLabel;
      document.getElementById('transactionId').placeholder = t.transactionIdPlaceholder;
      document.querySelector('label[for="accountDigits"]').textContent = t.accountDigitsLabel;
      document.getElementById('accountDigits').placeholder = t.accountDigitsPlaceholder;
      document.getElementById('btnText').textContent = t.openBtn;
      // Clear errors on language switch
      showError('transactionIdError', '');
      showError('accountDigitsError', '');
    }

    document.getElementById('langSelect').addEventListener('change', function() {
      setLanguage(this.value);
    });

    // Default to English
    setLanguage('en');

    let currentLang = 'en';
    document.getElementById('langSelect').addEventListener('change', function() {
      currentLang = this.value;
      setLanguage(currentLang);
    });

    function showError(id, message) {
      document.getElementById(id).textContent = message;
    }
    function clearErrors() {
      showError('transactionIdError', '');
      showError('accountDigitsError', '');
    }
    function setLoading(loading) {
      document.getElementById('openBtn').disabled = loading;
      document.getElementById('spinner').style.display = loading ? '' : 'none';
      const t = translations[currentLang];
      document.getElementById('btnText').textContent = loading ? t.openingBtn : t.openBtn;
    }
    function buildAndOpenUrl() {
      clearErrors();
      const baseUrl = 'https://apps.cbe.com.et:100/?id=';
      const transactionId = document.getElementById('transactionId').value.trim();
      const accountDigits = document.getElementById('accountDigits').value.trim();
      let hasError = false;
      const t = translations[currentLang];
      if (transactionId === '') {
        showError('transactionIdError', t.transactionIdError);
        hasError = true;
      }
      if (accountDigits.length !== 13 || isNaN(accountDigits)) {
        showError('accountDigitsError', t.accountDigitsError);
        hasError = true;
      }
      if (hasError) return;
      setLoading(true);
      setTimeout(() => {
        const last8 = accountDigits.slice(-8);
        const fullId = transactionId + last8;
        const fullUrl = baseUrl + encodeURIComponent(fullId);
        window.open(fullUrl, '_blank');
        setLoading(false);
      }, 600);
    }

    function updateAccountDigitsList() {
      const list = document.getElementById('accountDigitsList');
      list.innerHTML = '';
      const accounts = JSON.parse(localStorage.getItem('accountDigitsHistory') || '[]');
      accounts.forEach(acc => {
        const option = document.createElement('option');
        option.value = acc;
        list.appendChild(option);
      });
    }

    // Save account number to cache and history on input
    document.getElementById('accountDigits').addEventListener('input', function() {
      localStorage.setItem('accountDigits', this.value);
      let accounts = JSON.parse(localStorage.getItem('accountDigitsHistory') || '[]');
      if (this.value.length === 13 && !accounts.includes(this.value)) {
        accounts.push(this.value);
        localStorage.setItem('accountDigitsHistory', JSON.stringify(accounts));
        updateAccountDigitsList();
      }
    });

    // Always update datalist when field is focused
    document.getElementById('accountDigits').addEventListener('focus', updateAccountDigitsList);

    // Load cached account number and history if available
    window.addEventListener('DOMContentLoaded', function() {
      const cachedAccount = localStorage.getItem('accountDigits');
      if (cachedAccount) {
        document.getElementById('accountDigits').value = cachedAccount;
      }
      updateAccountDigitsList();
    });
  </script>
</body>
</html>
